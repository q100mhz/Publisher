# Админка: https://publisher-admin.itb2bhost.ru → приложение по пути /admin/
# Файл: /etc/nginx/sites-available/publisher-admin, затем ссылка в sites-enabled и certbot (см. README)
server {
    listen 80;
    server_name publisher-admin.itb2bhost.ru;

    location / {
        proxy_pass http://127.0.0.1:8090/admin/;   # слеш в конце: /users → /admin/users
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
