# Вставьте эти блоки ВНУТРЬ существующего server { ... } для itb2bhost.ru
# (обычно /etc/nginx/sites-available/itb2bhost.ru или /etc/nginx/conf.d/*.conf).
# Остальные сайты на домене не затрагиваются — проксируется только /publisher/.

location = /publisher {
    return 301 /publisher/;
}

location /publisher/ {
    proxy_pass http://127.0.0.1:8090;   # без слеша в конце: путь /publisher/... передаётся как есть
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 100m;   # загрузка нескольких картинок за раз
    proxy_read_timeout   120s;
}
