services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: publisher
      POSTGRES_USER: publisher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publisher -d publisher"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://publisher:${POSTGRES_PASSWORD}@db:5432/publisher
      MEDIA_DIR: /app/data/media
      TZ: Europe/Moscow
    volumes:
      - media:/app/data/media
    # Порт открыт только для самого сервера — снаружи сайт доступен через nginx по /publisher/
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8000"
    shm_size: "1gb"  # Chromium падает с маленьким /dev/shm
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
